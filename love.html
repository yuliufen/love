<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>母亲节快乐</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #ffc2d1, #ffe5ec);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      position: relative;
    }

    .container {
      text-align: center;
      animation: fadeIn 2s ease;
      z-index: 2;
      padding: 20px;
    }

    h1 {
      font-size: 68px;
      color: #ff4f81;
      text-shadow: 0 6px 18px rgba(255, 79, 129, 0.35);
      margin-bottom: 25px;
      animation: float 3s ease-in-out infinite;
    }

    .love {
      font-size: 60px;
      font-weight: bold;
      letter-spacing: 10px;
      color: white;
      margin-top: 10px;
      text-shadow: 0 6px 20px rgba(255, 105, 135, 0.45);
    }

    .love span {
      display: inline-block;
      animation: pop 1.8s infinite;
    }

    .love span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .love span:nth-child(3) {
      animation-delay: 0.4s;
    }

    .love span:nth-child(4) {
      animation-delay: 0.6s;
    }

    .love span:nth-child(5) {
      animation-delay: 0.8s;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 105, 135, 0.8);
      transform: rotate(45deg);
      animation: rise 8s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 105, 135, 0.8);
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    .tip {
      margin-top: 30px;
      font-size: 18px;
      color: #fff;
      opacity: 0.9;
      letter-spacing: 2px;
    }

    @keyframes rise {
      0% {
        transform: translateY(100vh) rotate(45deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(45deg) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes pop {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.25);
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 38px;
      }

      .love {
        font-size: 42px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>母亲节快乐 ❤️</h1>

    <div class="love">
      <span>L</span>
      <span>O</span>
      <span>V</span>
      <span>E</span>
      <span> U</span>
    </div>

    <div class="tip">愿所有温柔与爱，都属于妈妈 ✨</div>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');

      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.animationDuration = 5 + Math.random() * 5 + 's';
      heart.style.opacity = Math.random();
      heart.style.transform = `scale(${Math.random() + 0.5}) rotate(45deg)`;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 250);
  </script>
</body>
</html>
